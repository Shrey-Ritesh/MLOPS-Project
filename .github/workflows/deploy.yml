name: Deploy

# Continuous deployment: on every push to main, build the image, push it to ECR, then tell the
# EC2 server (through AWS SSM, no SSH) to pull it and restart.
#
# Authentication: access keys of a dedicated, least-privilege IAM user (policy in deploy/aws/).
# GitHub OIDC would be preferable, but this AWS account's service control policy denies creating
# an OIDC provider. The keys live only in GitHub Actions secrets, never in the repository.
#
# One-time setup (repo Settings -> Secrets and variables -> Actions):
#   Secrets:    AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY   (the deploy IAM user's access key)
#   Variables:  DEPLOY_INSTANCE_ID                         (EC2 instance id of the server)
# The instance must be running and registered with SSM when this workflow runs.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments at once, and never cancel one that is half way through.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: jee-tutor
  APP_DIR: /home/ubuntu/MLOPS-Project

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to the server via SSM
        env:
          INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail

          # Check out the commit on the server (so scripts/ and docker-compose.yml match the
          # image), then run the deploy script as the normal user that owns the repo.
          COMMANDS=$(jq -cn --arg dir "$APP_DIR" --arg sha "$GITHUB_SHA" --arg image "$IMAGE" '
            ["sudo -u ubuntu -H bash -c \"cd \($dir) && git fetch --quiet origin && git checkout --quiet --detach \($sha) && bash scripts/deploy.sh \($image)\""]')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $GITHUB_SHA" \
            --timeout-seconds 900 \
            --parameters "$(jq -cn --argjson c "$COMMANDS" '{commands: $c}')" \
            --query Command.CommandId --output text)
          echo "SSM command: $COMMAND_ID"

          # Poll for up to ~15 minutes (the first pull of a large image is slow).
          STATUS=Pending
          for _ in $(seq 1 90); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' --output yaml
          [ "$STATUS" = "Success" ] || { echo "Deploy failed with status: $STATUS" >&2; exit 1; }
