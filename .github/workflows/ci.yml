name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Validate YAML configs
        run: |
          python - <<'EOF'
          import glob, sys, yaml
          bad = 0
          for path in sorted(glob.glob("configs/**/*.y*ml", recursive=True)) + ["dvc.yaml"]:
              try:
                  yaml.safe_load(open(path))
              except yaml.YAMLError as exc:
                  print(f"INVALID {path}: {exc}")
                  bad += 1
          sys.exit(bad)
          EOF

      - name: Lint (errors only)
        run: ruff check --select E9,F63,F7,F82 src tests app.py

      - name: Unit tests
        run: python -m pytest -q

  api-smoke:
    # Integration stage: real uvicorn server on the checked-in fixture questions.
    # No Chroma, MLflow or secrets are required; retrieval degrades gracefully.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Start API and run smoke test
        env:
          JEE_QUESTIONS_PATH: tests/fixtures/jee_questions_sample.jsonl
        run: |
          python -m uvicorn src.api.app:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 && break
            sleep 1
          done
          python scripts/smoke_test_api.py http://127.0.0.1:8000 || { cat api.log; exit 1; }
