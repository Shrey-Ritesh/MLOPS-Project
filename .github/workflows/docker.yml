name: Docker build

# Separate from the fast PR checks: only runs when the image inputs change.
on:
  pull_request:
    branches: [dev, main]
    paths:
      - Dockerfile
      - .dockerignore
      - requirements-app.txt
      - app.py
      - src/**
      - configs/**
      - .github/workflows/docker.yml

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: jee-tutor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Missing configuration fails clearly
        run: |
          if docker run --rm -e GROQ_API_KEY= jee-tutor:ci; then
            echo "expected startup to fail without GROQ_API_KEY"; exit 1
          fi

      - name: Smoke test health endpoint
        run: |
          docker run -d --name tutor -p 8501:8501 -e GROQ_API_KEY=dummy-ci-key jee-tutor:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          docker logs tutor
          exit 1
