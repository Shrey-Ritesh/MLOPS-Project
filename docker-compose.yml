# Cap container logs (Docker's default json-file driver keeps them forever, unbounded).
# These logs are for operations only; the persistent prediction record is the
# predictions table in /app/data/state/monitoring.sqlite3.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  chroma:
    image: chromadb/chroma:1.5.3
    logging: *default-logging
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data
    restart: unless-stopped
    healthcheck:
      # The chroma image ships neither curl nor python; bash's /dev/tcp is available.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build: .
    image: ${APP_IMAGE:-jee-tutor:local}
    logging: *default-logging
    command: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8001:8000"
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      JEE_QUESTIONS_PATH: /app/data/processed/jee_questions.jsonl
      HF_HOME: /cache/huggingface
    volumes:
      - ./data/processed:/app/data/processed:ro
      - attempts_data:/app/data/attempts
      - hf_cache:/cache/huggingface
    depends_on:
      chroma:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 30s

  app:
    build: .
    image: ${APP_IMAGE:-jee-tutor:local}
    logging: *default-logging
    command:
      - sh
      - -c
      # Fail fast with a clear message (variable names only) if required config is missing.
      - python -m src.settings && exec streamlit run app.py --server.address=0.0.0.0 --server.port=8501 --server.headless=true
    ports:
      # Port 80 so the app opens as http://<server-ip>; some networks (e.g. college Wi-Fi) block 8501.
      - "80:8501"
      - "8501:8501"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      OCR_SPACE_API_KEY: ${OCR_SPACE_API_KEY:-}
      # Student accounts and progress live on a named volume so deploys keep them.
      USERS_CSV_PATH: /app/data/state/users.csv
      LEARNER_DB_PATH: /app/data/state/learner_history.sqlite3
      # Phase 3 prediction log (same persisted volume). The pseudonym key turns learner IDs into
      # irreversible keys before they are stored; keep it constant for the whole project.
      MONITORING_DB_PATH: /app/data/state/monitoring.sqlite3
      LOG_PSEUDONYM_KEY: ${LOG_PSEUDONYM_KEY:-}
      # Which model contract (features + label rule) predictions are logged under; must match monitor.
      MONITORING_CONTRACT: ${MONITORING_CONTRACT:-configs/monitoring/contracts/track_b_difficulty_v1.yaml}
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      HF_HOME: /cache/huggingface
    volumes:
      - ./data/processed:/app/data/processed:ro
      - app_state:/app/data/state
      - hf_cache:/cache/huggingface
    depends_on:
      chroma:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 40s

  # Phase 3 monitoring (Person 1): joins labels, evaluates monitoring windows, raises alerts,
  # and backs up the monitoring database nightly. Same image as the app; small resource caps
  # so it can never starve the tutor.
  monitor:
    image: ${APP_IMAGE:-jee-tutor:local}
    logging: *default-logging
    command: ["python", "-m", "src.monitoring.scheduler"]
    environment:
      MONITORING_DB_PATH: /app/data/state/monitoring.sqlite3
      MONITORING_CONTRACT: ${MONITORING_CONTRACT:-configs/monitoring/contracts/track_b_difficulty_v1.yaml}
      MONITORING_OUTPUT_DIR: /app/data/state/monitoring
      MONITORING_BACKUP_DIR: /app/data/backups
      # 15 by default; set e.g. MONITORING_WINDOW_MINUTES=2 in .env during the drift experiment.
      MONITORING_WINDOW_MINUTES: ${MONITORING_WINDOW_MINUTES:-15}
      MONITORING_TICK_SECONDS: ${MONITORING_TICK_SECONDS:-60}
      MONITORING_BACKUP_HOUR_UTC: "2"
    volumes:
      - app_state:/app/data/state
      - monitoring_backups:/app/data/backups
    cpus: 0.5
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      # Healthy while the scheduler has completed a tick in the last 5 minutes.
      test: ["CMD", "python", "-m", "src.monitoring.scheduler", "--check-heartbeat", "300"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 120s

  indexer:
    build: .
    image: ${APP_IMAGE:-jee-tutor:local}
    logging: *default-logging
    profiles: ["tools"]
    command: ["sh", "-c", "python -m src.retrieval.index_builder && python -m src.retrieval.jee_index_builder_v1"]
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      HF_HOME: /cache/huggingface
    volumes:
      - ./data/processed:/app/data/processed:ro
      - index_reports:/app/reports
      - hf_cache:/cache/huggingface
    depends_on:
      chroma:
        condition: service_healthy

volumes:
  chroma_data:
  attempts_data:
  hf_cache:
  index_reports:
  app_state:
  monitoring_backups:
