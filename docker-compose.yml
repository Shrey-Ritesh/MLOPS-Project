services:
  chroma:
    image: chromadb/chroma:1.5.3
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8001:8000"
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      JEE_QUESTIONS_PATH: /app/data/processed/jee_questions.jsonl
      HF_HOME: /cache/huggingface
    volumes:
      - ./data/processed:/app/data/processed:ro
      - attempts_data:/app/data/attempts
      - hf_cache:/cache/huggingface
    depends_on:
      chroma:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 30s

  app:
    build: .
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      OCR_SPACE_API_KEY: ${OCR_SPACE_API_KEY:-}
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      HF_HOME: /cache/huggingface
    volumes:
      - hf_cache:/cache/huggingface
    depends_on:
      chroma:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  indexer:
    build: .
    profiles: ["tools"]
    command: ["sh", "-c", "python -m src.retrieval.index_builder && python -m src.retrieval.jee_index_builder_v1"]
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      HF_HOME: /cache/huggingface
    volumes:
      - ./data/processed:/app/data/processed:ro
      - index_reports:/app/reports
      - hf_cache:/cache/huggingface
    depends_on:
      chroma:
        condition: service_healthy

volumes:
  chroma_data:
  attempts_data:
  hf_cache:
  index_reports:
